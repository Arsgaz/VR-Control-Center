name: Windows release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)process.exit(1)"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build installer, ZIP and verify bundled tools without system PATH
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.zip
            dist/*verification.json
            dist/*.blockmap
            dist/SHA256SUMS.txt
            dist/README-Windows.txt
          compression-level: 0

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its prepared artifacts unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "VR Control Center $RELEASE_TAG — Windows x64" --notes-file docs/releases/windows.md
